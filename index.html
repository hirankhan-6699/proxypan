<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Khoj</title>
<meta name="description" content="Thousands of anime in one place: posters, ratings, details and where to watch in India. Free.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: sticky header (brand, search, language) with list chips, poster grid below, details open in a dialog. */
  :root{
    --bg:#f7f4fb; --surface:#ffffff; --ink:#1c1630; --muted:#6b6482;
    --line:#e3dcf0; --accent:#e11d5a; --accent-ink:#ffffff; --chip:#ece6f6;
    --shadow:0 6px 24px rgba(40,20,80,.12);
    --display:'Bricolage Grotesque','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Trebuchet MS',system-ui,sans-serif;
    --body:'Figtree','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu',system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#130f1f; --surface:#1c1730; --ink:#f1ecfa; --muted:#a79fc0;
      --line:#2e2745; --accent:#ff4d85; --accent-ink:#1a0710; --chip:#272040;
      --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#130f1f; --surface:#1c1730; --ink:#f1ecfa; --muted:#a79fc0;
    --line:#2e2745; --accent:#ff4d85; --accent-ink:#1a0710; --chip:#272040;
    --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
  img{max-width:100%;display:block}
  button,input,select{font:inherit;color:inherit}
  a{color:var(--accent)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

  header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding-block:14px}
  .brand{font-family:var(--display);font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:0;line-height:1}
  .brand span{color:var(--accent)}
  .search{flex:1 1 260px;min-width:0;position:relative}
  .search input{width:100%;padding:12px 44px 12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1rem}
  .search input:focus{border-color:var(--accent);outline:none}
  .search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:8px 10px;cursor:pointer;border-radius:8px}
  .lang{flex:0 0 auto}
  .lang select{padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--chip);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.92rem;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

  .status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 8px;color:var(--muted);font-size:.92rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px 14px;padding-bottom:24px}
  .card{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:8px}
  .poster{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--chip);box-shadow:0 2px 10px rgba(30,10,60,.15);transition:transform .18s ease,box-shadow .18s ease}
  .poster img{width:100%;height:100%;object-fit:cover}
  .card:hover .poster,.card:focus-visible .poster{transform:translateY(-4px);box-shadow:var(--shadow)}
  .score{position:absolute;left:8px;bottom:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.8rem;padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
  .card h3{margin:0;font-size:.95rem;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{color:var(--muted);font-size:.8rem}

  .more{display:flex;justify-content:center;padding:8px 0 56px}
  .btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 26px;border-radius:12px;cursor:pointer}
  .btn[disabled]{opacity:.6;cursor:wait}
  .empty{padding:48px 0;text-align:center;color:var(--muted)}
  .skel .poster{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}

  dialog{width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);overflow:auto}
  dialog::backdrop{background:rgba(10,5,25,.65)}
  .dlg{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:24px}
  .dlg .poster{box-shadow:none}
  .dlg h2{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
  .alt{color:var(--muted);margin:0 0 12px;font-size:.95rem}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
  .facts li{background:var(--chip);border-radius:8px;padding:4px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}
  .facts li.hi{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .syn{margin:0 0 18px;white-space:pre-line;max-width:65ch}
  .dlg h4{margin:18px 0 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{display:inline-block;text-decoration:none;background:var(--chip);border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700;font-size:.9rem}
  .links a.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .note{color:var(--muted);font-size:.82rem;margin:8px 0 0}
  .close{position:sticky;top:10px;float:right;margin:10px 10px -44px 0;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:1.2rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;padding-block:20px 32px}

  @media (max-width:640px){
    .dlg{grid-template-columns:1fr;padding:18px}
    .dlg .poster{max-width:200px;margin-inline:auto}
    .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <h1 class="brand">Anime <span>Khoj</span></h1>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <input id="q" type="search" data-i18n-ph="placeholder" data-i18n-aria="searchAria" aria-label="Search anime">
        <button type="button" id="clear" data-i18n-aria="clear" aria-label="Clear search" hidden>✕</button>
      </form>
      <div class="lang">
        <select id="lang" data-i18n-aria="langLabel" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="bn">বাংলা</option>
          <option value="mr">मराठी</option>
          <option value="ta">தமிழ்</option>
          <option value="te">తెలుగు</option>
        </select>
      </div>
    </div>
    <div class="chips" id="chips" role="group" data-i18n-aria="chipsLabel" aria-label="Choose a list">
      <button class="chip" data-mode="top" data-i18n="top" aria-pressed="true">Top Rated</button>
      <button class="chip" data-mode="pop" data-i18n="pop" aria-pressed="false">Most Popular</button>
      <button class="chip" data-mode="air" data-i18n="air" aria-pressed="false">Airing Now</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status"><span id="count">Loading...</span><span id="heading"></span></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="more"><button class="btn" id="moreBtn" data-i18n="more" hidden>Show more anime</button></div>
  <div id="sentinel" style="height:1px"></div>
</main>

<footer>
  <div class="wrap" data-i18n="footer">Data from MyAnimeList via the free Jikan API.</div>
</footer>

<dialog id="dlg" aria-label="Anime details">
  <button class="close" id="closeBtn" data-i18n-aria="close" aria-label="Close">✕</button>
  <div class="dlg" id="dlgBody"></div>
</dialog>

      footer:'డేటా MyAnimeList నుంచి, ఉచిత Jikan API ద్వారా. స్ట్రీమింగ్ లింకులు MyAnimeList నుంచి వస్తాయి, భారతదేశంలో లభ్యత తరచూ మారుతుంది, కాబట్టి JustWatch Indiaలో నిర్ధారించుకోండి. కథా సారాంశాలు ఆంగ్లంలో ఉన్నాయి.',

    }

  var lang = 'en';
  try { var saved = localStorage.getItem('ak_lang'); if (saved && I18N[saved]) lang = saved; } catch(e){}

  function t(key, vars){
    var s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
    if (vars) Object.keys(vars).forEach(function(k){ s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }
  function num(n){ return Number(n).toLocaleString('en-IN'); }

  function applyStatic(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function(n){ n.textContent = t(n.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(n){ n.placeholder = t(n.getAttribute('data-i18n-ph')); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(n){ n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria'))); });
    $('lang').value = lang;
  }

  /* ---------- App ---------- */
  var API = 'https://api.jikan.moe/v4';
  var PER = 24;
  function $(id){ return document.getElementById(id); }
  var grid = $('grid'), moreBtn = $('moreBtn'), countEl = $('count'), headEl = $('heading'),
      emptyEl = $('empty'), qEl = $('q'), clearBtn = $('clear'), dlg = $('dlg'), dlgBody = $('dlgBody');

  var state = { mode:'top', q:'', page:0, hasNext:true, loading:false, total:0, seen:new Set(), items:[], token:0, errMsg:'', current:null };
  var fullCache = {};
  var TYPE = { TV:'TV', Movie:'Movie', OVA:'OVA', ONA:'ONA', Special:'Special', Music:'Music', TV_Special:'TV Special' };

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function getJSON(url){
    for (var attempt = 1; attempt <= 4; attempt++){
      var res;
      try { res = await fetch(url); } catch(e){ if (attempt === 4) throw e; await sleep(800 * attempt); continue; }
      if (res.status === 429 || res.status >= 500){ await sleep(1100 * attempt); continue; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }
    throw new Error('API busy');
  }

  function listUrl(){
    var p = state.page + 1;
    if (state.q) return API + '/anime?q=' + encodeURIComponent(state.q) + '&page=' + p + '&limit=' + PER + '&sfw=true';
    var f = state.mode === 'pop' ? '&filter=bypopularity' : state.mode === 'air' ? '&filter=airing' : '';
    return API + '/top/anime?page=' + p + '&limit=' + PER + '&sfw=true' + f;
  }

  function poster(a){
    var im = a.images || {};
    return (im.webp && (im.webp.large_image_url || im.webp.image_url)) || (im.jpg && (im.jpg.large_image_url || im.jpg.image_url)) || '';
  }
  function title(a){ return a.title_english || a.title || 'Unknown'; }
  function statusLabel(s){ return s === 'Finished Airing' ? t('stFin') : s === 'Currently Airing' ? t('stAir') : s === 'Not yet aired' ? t('stUp') : s; }

  function makeCard(a){
    var b = document.createElement('button');
    b.className = 'card'; b.type = 'button';
    b.setAttribute('aria-label', t('openDetails', { t: title(a) }));
    var p = document.createElement('div'); p.className = 'poster';
    var src = poster(a);
    if (src){
      var img = document.createElement('img');
      img.loading = 'lazy'; img.decoding = 'async'; img.alt = t('posterAlt', { t: title(a) });
      img.referrerPolicy = 'no-referrer'; img.src = src;
      p.appendChild(img);
    }
    if (a.score){
      var s = document.createElement('span'); s.className = 'score'; s.textContent = '★ ' + a.score.toFixed(2);
      p.appendChild(s);
    }
    var h = document.createElement('h3'); h.textContent = title(a);
    var m = document.createElement('div'); m.className = 'meta';
    var bits = [];
    if (a.type) bits.push(TYPE[a.type] || a.type);
    if (a.year) bits.push(a.year);
    if (a.episodes) bits.push(t('epShort', { n: a.episodes }));
    m.textContent = bits.join(' · ');
    b.appendChild(p); b.appendChild(h); b.appendChild(m);
    b.addEventListener('click', function(){ openDetails(a); });
    return b;
  }

  function showSkeleton(n){
    for (var i = 0; i < n; i++){
      var d = document.createElement('div'); d.className = 'card skel'; d.setAttribute('data-skel','1');
      d.innerHTML = '<div class="poster"></div><div class="meta">&nbsp;</div>';
      grid.appendChild(d);
    }
  }
  function clearSkeleton(){ grid.querySelectorAll('[data-skel]').forEach(function(n){ n.remove(); }); }

  function updateStatus(){
    var shown = state.items.length;
    headEl.textContent = state.q ? t('searchH', { q: state.q }) : t(state.mode + 'H');
    if (state.loading && !shown) countEl.textContent = t('loading');
    else if (state.total) countEl.textContent = t('count', { n: num(shown), t: num(state.total) });
    else countEl.textContent = t('countNoTotal', { n: num(shown) });
    moreBtn.hidden = !state.hasNext || shown === 0;
    moreBtn.textContent = state.loading ? t('loading') : t('more');
    if (!shown && !state.loading) {
      emptyEl.hidden = false;
      emptyEl.textContent = state.errMsg ? t('err', { e: state.errMsg }) : t('none');
    } else { emptyEl.hidden = true; }
  }

  async function loadMore(){
    if (state.loading || !state.hasNext) return;
    state.loading = true; state.errMsg = ''; moreBtn.disabled = true; updateStatus();
    var token = state.token;
    showSkeleton(state.page === 0 ? 12 : 6);
    try {
      var data = await getJSON(listUrl());
      if (token !== state.token) return;
      clearSkeleton();
      state.page += 1;
      var pg = data.pagination || {};
      state.hasNext = !!pg.has_next_page;
      if (pg.items && pg.items.total) state.total = pg.items.total;
      var frag = document.createDocumentFragment();
      (data.data || []).forEach(function(a){
        if (state.seen.has(a.mal_id)) return;
        state.seen.add(a.mal_id); state.items.push(a);
        frag.appendChild(makeCard(a));
      });
      grid.appendChild(frag);
    } catch(err){
      if (token !== state.token) return;
      clearSkeleton();
      state.errMsg = err.message || 'error';
    } finally {
      if (token === state.token){
        state.loading = false; moreBtn.disabled = false;
        updateStatus();
      }
    }
  }

  function reset(){
    state.token += 1; state.page = 0; state.hasNext = true; state.total = 0; state.loading = false; state.errMsg = '';
    state.seen = new Set(); state.items = []; grid.innerHTML = ''; emptyEl.hidden = true; moreBtn.hidden = true;
    countEl.textContent = t('loading');
    loadMore();
  }

  function rerender(){
    grid.innerHTML = '';
    var frag = document.createDocumentFragment();
    state.items.forEach(function(a){ frag.appendChild(makeCard(a)); });
    grid.appendChild(frag);
    if (state.loading) showSkeleton(6);
    updateStatus();
  }

  /* Language switch */
  $('lang').addEventListener('change', function(){
    lang = $('lang').value;
    try { localStorage.setItem('ak_lang', lang); } catch(e){}
    applyStatic(); rerender();
    if (dlg.open && state.current) openDetails(state.current);
  });

  /* Search */
  function syncChips(){
    document.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', (!state.q && c.dataset.mode === state.mode) ? 'true' : 'false'); });
  }
  var timer;
  qEl.addEventListener('input', function(){
    var v = qEl.value.trim();
    clearBtn.hidden = !qEl.value;
    clearTimeout(timer);
    timer = setTimeout(function(){
      if (v === state.q) return;
      state.q = v; syncChips(); reset();
    }, 500);
  });
  $('searchForm').addEventListener('submit', function(e){
    e.preventDefault(); clearTimeout(timer);
    var v = qEl.value.trim();
    if (v !== state.q){ state.q = v; syncChips(); reset(); }
    qEl.blur();
  });
  clearBtn.addEventListener('click', function(){
    qEl.value = ''; clearBtn.hidden = true;
    if (state.q){ state.q = ''; syncChips(); reset(); }
    qEl.focus();
  });

  $('chips').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return;
    state.mode = c.dataset.mode; state.q = ''; qEl.value = ''; clearBtn.hidden = true;
    syncChips(); reset();
  });

  moreBtn.addEventListener('click', loadMore);
  if ('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ if (es[0].isIntersecting && state.items.length && !state.loading) loadMore(); }, { rootMargin:'600px' }).observe($('sentinel'));
  }

  /* Details dialog */
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function linkBtn(href, text, main){ var a = el('a', main ? 'main' : '', text); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; }

  function openDetails(a){
    state.current = a;
    dlgBody.innerHTML = '';
    var left = el('div'); var p = el('div', 'poster');
    var src = poster(a);
    if (src){ var img = document.createElement('img'); img.alt = t('posterAlt', { t: title(a) }); img.referrerPolicy = 'no-referrer'; img.src = src; p.appendChild(img); }
    left.appendChild(p);

    var right = el('div');
    right.appendChild(el('h2', '', title(a)));
    var alt = [];
    if (a.title_japanese) alt.push(a.title_japanese);
    if (a.title && a.title !== title(a)) alt.push(a.title);
    if (alt.length) right.appendChild(el('p', 'alt', alt.join(' · ')));

    var facts = el('ul', 'facts');
    function fact(txt, hi){ facts.appendChild(el('li', hi ? 'hi' : '', txt)); }
    if (a.score) fact('★ ' + a.score.toFixed(2) + (a.scored_by ? ' (' + t('votes', { n: num(a.scored_by) }) + ')' : ''), true);
    if (a.rank) fact(t('rank', { n: num(a.rank) }));
    if (a.popularity) fact(t('popularity', { n: num(a.popularity) }));
    if (a.type) fact(TYPE[a.type] || a.type);
    if (a.episodes) fact(t('eps', { n: a.episodes }));
    if (a.year) fact(String(a.year));
    if (a.status) fact(statusLabel(a.status));
    if (a.rating) fact(a.rating.split(' - ')[0]);
    right.appendChild(facts);

    var genres = (a.genres || []).concat(a.themes || []).map(function(g){ return g.name; });
    if (genres.length) right.appendChild(el('p', 'alt', genres.join(' · ')));

    var syn = a.synopsis ? a.synopsis.replace(/\[Written by MAL Rewrite\]/g, '').trim() : t('noSyn');
    var synEl = el('p', 'syn', syn); synEl.lang = a.synopsis ? 'en' : lang;
    right.appendChild(synEl);

    right.appendChild(el('h4', '', t('where')));
    var links = el('div', 'links'); links.id = 'watchLinks';
    links.appendChild(linkBtn('https://www.justwatch.com/in/search?q=' + encodeURIComponent(title(a)), t('justwatch'), true));
    right.appendChild(links);
    var note = el('p', 'note', t('checking')); note.id = 'watchNote';
    right.appendChild(note);

    right.appendChild(el('h4', '', t('moreLinks')));
    var more = el('div', 'links');
    if (a.trailer && a.trailer.url) more.appendChild(linkBtn(a.trailer.url, t('trailer')));
    if (a.url) more.appendChild(linkBtn(a.url, t('mal')));
    right.appendChild(more);

    dlgBody.appendChild(left); dlgBody.appendChild(right);
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
    loadStreaming(a);
  }

  async function loadStreaming(a){
    var note = $('watchNote'), links = $('watchLinks');
    try {
      var full = fullCache[a.mal_id];
      if (!full){ var d = await getJSON(API + '/anime/' + a.mal_id + '/full'); full = d.data; fullCache[a.mal_id] = full; }
      if ($('watchNote') !== note) return; // a different anime was opened meanwhile
      var st = (full && full.streaming) || [];
      st.forEach(function(s){ if (s.url) links.appendChild(linkBtn(s.url, s.name)); });
      note.textContent = st.length ? t('noteListed') : t('noteNone');
    } catch(e){
      if ($('watchNote') === note) note.textContent = t('noteFail');
    }
  }

  $('closeBtn').addEventListener('click', function(){ dlg.close(); });
  dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', function(){ state.current = null; });

  applyStatic();
  reset();
})();
</script>
